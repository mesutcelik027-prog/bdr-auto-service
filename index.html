<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BDR AUTO SERVICE</title>
<meta name="theme-color" content="#18202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BDR Servis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
#splash{position:fixed;inset:0;z-index:9999;background:#18202c;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease}
#splash svg{width:min(80vw,440px);height:auto;display:block;animation:spin .9s ease-out both}
#splash.out{opacity:0;pointer-events:none}
@keyframes spin{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash svg{animation:none}}
:root{--bg:#eef1f2;--sf:#fff;--ink:#14202b;--mut:#5d6b77;--ln:#d5dbe0;--pt:#0f4c5c;--ptx:#fff;--in:#17745a;--out:#b0303f;--am:#8a5d00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--sf:#18222b;--ink:#e6edf2;--mut:#93a2af;--ln:#2a3844;--pt:#5cb6c9;--ptx:#08222a;--in:#4ec59f;--out:#f07582;--am:#e0a93b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--sf:#18222b;--ink:#e6edf2;--mut:#93a2af;--ln:#2a3844;--pt:#5cb6c9;--ptx:#08222a;--in:#4ec59f;--out:#f07582;--am:#e0a93b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px;font-variant-numeric:tabular-nums}
header{position:relative;padding:18px 18px 6px}
.rpb{position:absolute;top:14px;right:18px;display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--pt);font:inherit;font-size:14px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.rpb[hidden]{display:none}
.chips.pf{flex-wrap:nowrap;gap:6px;margin-top:12px}
.chips.pf .chip{flex:1 1 auto;padding:8px 6px;font-size:13.5px;text-align:center;white-space:nowrap}
.chips.pk .chip{padding:8px 4px}
.cs h2{margin:14px 0 2px}
.cs .chips{padding:2px 0 6px}
.cs .chips.pf{margin-top:0}
.cs>.m{margin:0 0 8px!important}
.cbar{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
.cbar input{flex:1;min-width:0;width:auto;margin:0}
.cbar .btn{flex:none;width:auto;padding:12px 12px;font-size:14px;white-space:nowrap}
.rpb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px}
main{padding:0 18px;max-width:680px;margin:0 auto}
h2{font-size:15px;font-weight:600;color:var(--mut);margin:26px 0 6px}
.acc{background:var(--sf);border-top:3px solid var(--pt);border-radius:0 0 6px 6px}
.acc button,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--ln);color:inherit;font:inherit;text-align:left}
.acc button:last-child,.list .row:last-child{border-bottom:0}
.acc .n{font-weight:600}.acc .d{color:var(--mut);font-size:13px}
.big{font-size:20px;font-weight:800;white-space:nowrap}
.pos{color:var(--in)}.neg{color:var(--out)}.amb{color:var(--am)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0;overflow-wrap:anywhere}
.box{background:var(--sf);padding:14px;border-radius:6px;border-left:3px solid var(--ln)}
.box b{display:block;font-size:18px}
.list{background:var(--sf);border-radius:6px}
.row .l{min-width:0}.row .t{font-size:13px;color:var(--mut)}.row .c{font-weight:600;overflow-wrap:anywhere}.row .m{font-size:12px;color:var(--mut)}
.row .r{text-align:right;white-space:nowrap}
.del{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;padding:8px 0 2px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;padding:7px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--ink);font:inherit;font-size:14px}
.chip.on{background:var(--pt);color:var(--ptx);border-color:var(--pt)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-size:13px;color:var(--mut)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
.btn{padding:13px 18px;border:0;border-radius:6px;background:var(--pt);color:var(--ptx);font:inherit;font-weight:600;width:100%}
.btn.g{background:none;color:var(--ink);border:1px solid var(--ln)}
.lnk{background:none;border:0;color:var(--pt);font:inherit;padding:10px 0;text-decoration:underline}
nav{--or:#e8710a;position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -4px 18px rgba(0,0,0,.10);padding-bottom:max(4px,calc(env(safe-area-inset-bottom,0px) - 16px));z-index:5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{--or:#ff9a3c}}
:root[data-theme="dark"] nav{--or:#ff9a3c}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:600;-webkit-tap-highlight-color:transparent}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--or)}
nav button.on svg{stroke-width:2.4}
nav button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--or)}
nav .add i{display:grid;place-items:center;width:50px;height:50px;margin-top:-22px;border-radius:50%;background:var(--pt);border:3px solid var(--sf);box-shadow:0 4px 12px rgba(0,0,0,.28);transition:transform .12s,background .12s}
nav .add i svg{width:26px;height:26px;stroke:var(--ptx);stroke-width:2.8}
nav .add:active i{transform:scale(.92);background:var(--or)}
dialog{border:0;border-radius:10px;padding:18px;width:min(92vw,460px);background:var(--sf);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.empty{padding:22px 14px;color:var(--mut)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--pt);font:inherit;font-size:18px;font-weight:600;padding:12px 14px 12px 0;margin-left:-2px}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:2px 12px}
.chd>span:first-child{min-width:0}
.chd .acts{display:flex;gap:18px;margin-left:auto;white-space:nowrap}
.chd .lnk{font-size:14px;padding:2px 0}
.cw{border-bottom:1px solid var(--ln)}.cw:last-child{border-bottom:0}.cw .row{border-bottom:0}
.sg{max-height:224px;overflow-y:auto;border:1px solid var(--ln);border-radius:6px;background:var(--bg);margin:-8px 0 12px;-webkit-overflow-scrolling:touch}.sg:empty{display:none}.sg button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--ln);background:none;color:inherit;font:inherit}.sg button:last-child{border-bottom:0}
.ek{display:flex;gap:12px;background:var(--sf);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.ek .dt{width:46px;text-align:center;flex:none}.ek .dt b{display:block;font-size:24px;font-weight:600;line-height:1.1}.ek .dt span{font-size:12px;color:var(--mut)}
.ek .bar{width:3px;border-radius:2px;background:var(--out);flex:none}.ek.g .bar{background:var(--in)}.ek.n .bar{background:var(--mut)}
.ek .bd{flex:1;min-width:0}.ek .t1,.ek .t2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ek .t1{padding-bottom:8px;border-bottom:1px solid var(--ln);min-height:32px;overflow-wrap:anywhere}.ek .t2{padding-top:8px;color:var(--mut);font-size:14px}
.ek .am{font-weight:800;white-space:nowrap}.ek .am.b{color:#2f5fd0}.ek .ac{display:flex;justify-content:flex-end;gap:20px;padding-top:2px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ek .am.b{color:#8fb0ff}}
:root[data-theme="dark"] .ek .am.b{color:#8fb0ff}
</style>
</head>

for(const k in LB)T[k].l=LB[k];

const fmt=n=>(Math.round(n*100)/100||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});

function migr(o){o.cariler.forEach(c=>{if(c.tip!=='t'&&!Array.isArray(c.araclar)){c.araclar=(c.plaka||c.marka||c.model)?[{id:uid(),plaka:c.plaka||'',marka:c.marka||'',model:c.model||''}]:[];delete c.plaka;delete c.marka;delete c.model}})}

function save(){try{localStorage.setItem('kbc1',JSON.stringify(S))}catch(e){}try{bkSched()}catch(e){}}

const cname=id=>{const c=S.cariler.find(x=>x.id===id);return c?c.ad:''};
function balances(ex,upto){const b={kasa:0,banka:0,odeal:0,kart:0};S.hareket.forEach(h=>{if(h.id===ex||(upto&&h.tarih>upto))return;const t=T[h.t];if(t){for(const k in t.a)b[k]+=t.a[k]*h.tutar;if(t.fee&&h.ucret)for(const k in t.fee)b[k]+=t.fee[k]*h.ucret}});for(const k in b)b[k]=Math.round(b[k]*100)/100||0;return b}

function rowOld(h,showCari){
const t=T[h.t];if(!t)return'';

const cl=t.g==='in'?'pos':t.g==='out'?'neg':'';
const armed=V.armed===h.id;

function editH(id){V.armed=null;openForm(null,id)}
function del(id){if(V.armed===id){const bb=balances(id),pre=balances(),bad=['kasa','banka','odeal'].filter(k=>bb[k]<-0.005&&bb[k]<pre[k]-0.005);if(bad.length){V.armed=null;dlg.innerHTML='<b>Hareket silinemiyor</b><p>Silersen '+bad.map(k=>ACC[k][0]).join(', ')+' bakiyesi eksiye düşer. Bu tutara dayanan sonraki hareketleri önce düzenle veya sil.</p><button class="btn" onclick="dlg.close()">Tamam</button>';dlg.showModal();render();return}S.hareket=S.hareket.filter(h=>h.id!==id);V.armed=null;save()}else V.armed=id;render()}
function home(){
const R=prange(),b=balances(),PH=S.hareket.filter(h=>h.tarih>=R[0]&&h.tarih<=R[1]);let al=0,bo=0;S.cariler.forEach(c=>{const x=cariBal(c.id);if(x>0)al+=x;else bo-=x});
const last=[...PH].sort((a,b)=>b.tarih.localeCompare(a.tarih)||b.id.localeCompare(a.id)).slice(0,6);
const ks={};PH.forEach(h=>{if(h.ucret>0&&T[h.t]&&T[h.t].fl)ks[T[h.t].fl]=(ks[T[h.t].fl]||0)+h.ucret});
return`${pfUI(R)}<h2>Hesaplar</h2><div class="acc">${Object.keys(ACC).map(k=>`<button onclick="V.f='${k}';go('list')"><span><span class="n">${ACC[k][0]}</span><br><span class="d">${ACC[k][1]}</span><br><span class="d">${pm(PH,k)}</span></span><span class="big ${k==='kart'?(b[k]>0?'neg':''):k==='odeal'?(b[k]<0?'neg':'amb'):(b[k]<0?'neg':'')}">${fmt(b[k])}</span></button>`).join('')}</div>
<h2>Dönem hareketleri</h2><div class="two"><div class="box">Toplam tahsilat<b class="pos">${fmt(PH.filter(h=>T[h.t]&&T[h.t].g==='in').reduce((s,h)=>s+h.tutar,0))}</b></div><div class="box">Toplam tediye<b class="neg">${fmt(PH.filter(h=>T[h.t]&&T[h.t].g==='out').reduce((s,h)=>s+h.tutar,0))}</b></div></div><h2>Cari durumu</h2><div class="two"><div class="box">Alacağımız<b class="pos">${fmt(al)}</b></div><div class="box">Borcumuz<b class="neg">${fmt(bo)}</b></div></div>

function calc(src){
btot();
const el=id=>document.getElementById(id),g=id=>parseN(el(id).value),r=x=>Math.round(x*100)/100,f=x=>x?fmtAmt(String(x).replace('.',',')):'',pc=x=>f(Math.round((x+1e-9)*100)/100);
if(!PCT[el('f-t').value])return;
const tu=g('f-tu');if(!(tu>0))return;const AD=el('f-t').value==='bank_out',o=el('f-o');
let u;
if(src!=='u'&&src!=='o'&&src!=='n'&&!o.dataset.m&&!o.dataset.x&&!g('f-o')&&g('f-u')>0&&LS!=='n'){o.dataset.m='1';o.dataset.f=String(g('f-u'))}
if(src==='o'){LS='o';delete o.dataset.x;delete o.dataset.m}else if(src==='n'){LS='n';delete o.dataset.m}
if(src==='u'){u=g('f-u')||0;LS='o';o.dataset.x=String(u/tu*100);o.dataset.m='1';o.dataset.f=String(u)}
else if(o.dataset.m==='1'&&LS!=='n'){u=parseFloat(o.dataset.f)||0;o.dataset.x=String(u/tu*100)}
else if(LS==='n'){const n=g('f-net');if(isNaN(n))return;u=Math.max(0,r(AD?n-tu:tu-n));o.dataset.x=String(u/tu*100)}
else{const x=o.dataset.x?parseFloat(o.dataset.x):(g('f-o')||0);u=r(tu*x/100)}
if(o.dataset.x)o.value=pc(parseFloat(o.dataset.x));
if(src!=='u')el('f-u').value=f(u);
if(LS!=='n')el('f-net').value=fmtAmt(String(r(AD?tu+u:tu-u)).replace('.',','))}
